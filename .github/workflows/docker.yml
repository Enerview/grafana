name: Docker

on:
  workflow_dispatch:

jobs:
  docker:
    # High-RAM self-hosted ARC runner (m.2xlarge, dind) for the from-source
    # frontend build (was ubuntu-latest).
    runs-on: arc-runner-set-grafana

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use the pull_request head ref if it's a PR, otherwise default
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make golang-go

      - name: Build a Docker image
        run: make build-docker-full

      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Image
        run: |
          docker tag docker.io/grafana/grafana-oss:dev ghcr.io/${{ github.repository_owner }}/grafana:13.2-1
          docker push ghcr.io/${{ github.repository_owner }}/grafana:13.2-1
